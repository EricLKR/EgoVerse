_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  camera_transforms: {}
  diffusion: true
  6dof: true

  ac_keys:
    piper_left_arm: actions_cartesian
  shared_ac_key: actions_cartesian

  trunk:
    embed_dim: 256
    num_blocks: 16
    num_heads: 8
    token_postprocessing: action_token
    observation_horizon: 1
    action_horizon: 64
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: pytorch

  multitask: false
  pretrained: false
  pretrained_checkpoint: null
  domains: [piper_left_arm]

  # Raw front RGB is encoded online by a frozen DINOv3 ViT-L/16.
  shared_obs_keys: [front_img_1]
  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 1024
      output_dim: 256
      widths: [256]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 64
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 256

  stem_specs:
    piper_left_arm:
      # Keep the baseline frozen ResNet18 on the wrist camera.
      wrist_img:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 256
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 10
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256

  head_specs:
    piper_left_arm: null
    shared:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 100
      num_inference_steps: 10
      pooling: null
      padding: zero
      time_dist: beta
      early_horizon: 30
      early_weight: 2.0
      rotation_geodesic_weight: 0.1
      infer_ac_dims:
        piper_left_arm: 10
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 10
        act_seq: 100
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4

  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.FrozenDINOv3Encoder
      model_name: ${oc.env:PIPER_HPC}/models/dinov3-vitl16
      dtype: bfloat16
      local_files_only: true
      image_size: 224
    wrist_img:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 256
      freeze_backbone: true
      normalize_input: true

  # Both encoders own their ImageNet normalization. Color jitter therefore
  # remains valid for both raw streams without applying one normalization twice.
  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms: []

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 1400
  eta_min: 1e-5
