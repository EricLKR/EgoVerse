_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.hpt.HPT
  camera_transforms: {}

  diffusion: true
  6dof: true

  # Same action key name on both sides ("actions_cartesian", 10D = pose(9,
  # xyz + continuous 6D rotation) + gripper(1)) -- Piper's cartesian_base
  # transform produces it directly; Human's comes via
  # human_single_arm.get_transform_list(mode="cartesian_padded"), which
  # zero-pads the (gripper-less) human pose to match. See
  # egomimic/rldb/embodiment/{piper,human_single_arm}.py.
  ac_keys:
    piper_left_arm: "actions_cartesian"
    human_left_arm: "actions_cartesian"
  shared_ac_key: "actions_cartesian"

  trunk:
    embed_dim: 256
    num_blocks: 16
    num_heads: 8
    token_postprocessing: "action_token"
    observation_horizon: 1
    action_horizon: 64
    no_trunk: false
    use_domain_embedding: true
    drop_path: 0.1
    weight_init_style: "pytorch"

  multitask: false
  pretrained: false
  pretrained_checkpoint: null

  domains: ["piper_left_arm", "human_left_arm"]
  # Both embodiments have a "front_img_1" camera -- shared trunk-facing stem.
  # Piper's "wrist_img" (no human counterpart) and each embodiment's own
  # "state_ee_pose" (different dims: 8 for Piper incl. gripper, 7 for Human)
  # go in the per-domain stem_specs below instead.
  shared_obs_keys: ["front_img_1"]

  shared_stem_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.MLPPolicyStem
      input_dim: 256 # matches encoder_specs.front_img_1.output_dim
      output_dim: 256
      widths: [256]
      specs:
        random_horizon_masking: false
        cross_attn:
          crossattn_latent: 16
          crossattn_heads: 8
          crossattn_dim_head: 64
          crossattn_modality_dropout: 0.1
          modality_embed_dim: 256

  stem_specs:
    piper_left_arm:
      wrist_img:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 256
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 10 # Piper obs: pose(9, xyz+6D rotation) + gripper(1)
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256
    human_left_arm:
      state_ee_pose:
        _target_: egomimic.models.hpt_nets.MLPPolicyStem
        input_dim: 9 # Human obs: pose(9, xyz+6D rotation) only, no gripper
        output_dim: 256
        widths: [256]
        specs:
          random_horizon_masking: false
          cross_attn:
            crossattn_latent: 16
            crossattn_heads: 8
            crossattn_dim_head: 64
            crossattn_modality_dropout: 0.1
            modality_embed_dim: 256

  head_specs:
    piper_left_arm: null
    human_left_arm: null
    shared:
      _target_: egomimic.models.fm_policy.FMPolicy
      action_horizon: 100
      num_inference_steps: 50
      pooling: null
      padding: "zero"
      time_dist: "beta"
      infer_ac_dims:
        piper_left_arm: 10
        human_left_arm: 10
      model:
        _target_: egomimic.models.denoising_nets.CrossTransformer
        nblocks: 6
        cond_dim: 256
        hidden_dim: 128
        act_dim: 10
        act_seq: 100
        n_heads: 4
        dropout: 0.1
        mlp_layers: 4
        mlp_ratio: 4

  # Raw-pixel ResNet18 encoders -- freeze_backbone=true per "freeze the vision
  # backbone, train the action [pathway]": these run once per camera key,
  # output feeds the (trainable) stems above. Unlike the DINO-embedding-based
  # cotrain templates (hpt_cotrain_flow_shared_head.yaml and friends), this
  # matches hpt_bc_flow_eva.yaml's pattern -- raw JPEG frames in, no offline
  # embedding pipeline required.
  encoder_specs:
    front_img_1:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 256
      freeze_backbone: true
    wrist_img:
      _target_: egomimic.models.hpt_nets.ResNet
      output_dim: 256
      freeze_backbone: true

  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.ColorJitter
        brightness: 0.1
        contrast: 0.1
        saturation: 0.1
        hue: 0.05
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.0001

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: 1400
  eta_min: 1e-5
