_target_: egomimic.pl_utils.pl_model.ModelWrapper
robomimic_model:
  _target_: egomimic.algo.pi.PI
  config:
    pytorch_training_precision: bfloat16
    # Formal runs must point this at a converted official pi0.5 PyTorch
    # checkpoint.  Keeping it environment-controlled avoids silently using a
    # path owned by another cluster account.  A smoke run may explicitly set
    # this to null to validate code/data plumbing with random initialization.
    pytorch_weight_path: ${oc.env:PI05_PYTORCH_WEIGHTS,null}
    model:
      pi05: true
      action_dim: 32
      action_horizon: 100
      max_token_len: 180
      # Avoid per-process torch.compile warmup on short HPC jobs. It can be
      # enabled deliberately after profiling a long formal run.
      pytorch_compile_mode: null

  # Prompt assembly + tokenization. The PI algo owns the tokenizer because
  # the prompt template is model-specific (paligemma + pi0.5 anchor). All
  # of these were previously in the data config.
  #
  # Three orthogonal inclusion flags govern what gets spliced into the prompt:
  #   proprio_in_prompt — append "State: <bins>" (pi0.5 discretized proprio)
  #   embodiment_label  — append "Embodiment: <name>"
  #   control_mode      — append "Control mode: <descriptor>" (per-embodiment dict
  #                       or null to omit; every embodiment in the run MUST have
  #                       a matching key — no fallback, an unmatched one raises)
  #
  # If any of these is active, the prompt is rendered as
  #   "Task: {prompt}, <blocks>;\nAction: "
  # Otherwise the raw prompt is tokenized as-is (pre-pi0.5 / language behaviour).
  #
  # Override per-run for lang / wristframe variants, e.g.
  #   model.robomimic_model.annotation_key=annotations
  #   model.robomimic_model.default_prompt="this is a bad action"
  #   model.robomimic_model.control_mode='{human: "wrist frame xyzypr per arm", eva: "wrist frame xyzypr gripper per arm"}'
  # Metadata only: PI uses OpenPI's public paligemma_tokenizer.model directly.
  tokenizer_model_name: "openpi-paligemma-sentencepiece"
  tokenizer_max_length: 128
  sampling_mode: "random"
  annotation_key: "annotations"
  default_prompt: "This is a bad action."
  proprio_in_prompt: true
  embodiment_label: true
  state_num_bins: 256
  control_mode: null

  train_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Resize
        size: 224
        interpolation: 3
  eval_image_augs:
    _target_: torchvision.transforms.Compose
    transforms:
      - _target_: torchvision.transforms.Resize
        size: 224
        interpolation: 3

enable_grad_norm: false

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 3e-5
  betas: [0.9, 0.999]
  eps: 1e-8
  weight_decay: 0.0

scheduler:
  _target_: transformers.get_cosine_schedule_with_warmup
  _partial_: true
  num_warmup_steps: 2000
  num_training_steps: 60000
  num_cycles: 0.5

scheduler_interval: step
