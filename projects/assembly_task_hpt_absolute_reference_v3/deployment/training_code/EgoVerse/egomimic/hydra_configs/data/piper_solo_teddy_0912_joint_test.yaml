_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Independent held-out collection.  Never use session 7 for checkpoint
# selection, hyperparameter tuning, normalization statistics, or early stopping.
train_datasets:
  piper_left_arm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:PIPER_HPC}/data/piper_zarr_teddy_0912
      key_map:
        _target_: egomimic.rldb.embodiment.piper_joint.PiperJoint.get_keymap
        keymap_mode: joint
      transform_list:
        _target_: egomimic.rldb.embodiment.piper_joint.PiperJoint.get_transform_list
        mode: joint
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['task_name'] in ['teddy_0912_1', 'teddy_0912_2', 'teddy_0912_3', 'teddy_0912_4', 'teddy_0912_5']"
    mode: total
    reject_outliers: true
    error_on_nan_inf: true

valid_datasets:
  piper_left_arm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:PIPER_HPC}/data/piper_zarr_teddy_0912
      key_map:
        _target_: egomimic.rldb.embodiment.piper_joint.PiperJoint.get_keymap
        keymap_mode: joint
      transform_list:
        _target_: egomimic.rldb.embodiment.piper_joint.PiperJoint.get_transform_list
        mode: joint
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['task_name'] == 'teddy_0912_7'"
    mode: total
    reject_outliers: false
    error_on_nan_inf: true

train_dataloader_params:
  piper_left_arm:
    batch_size: 8
    num_workers: 4
valid_dataloader_params:
  piper_left_arm:
    batch_size: 8
    num_workers: 4
