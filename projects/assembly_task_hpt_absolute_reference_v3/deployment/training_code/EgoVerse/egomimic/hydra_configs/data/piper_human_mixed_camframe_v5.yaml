_target_: egomimic.pl_utils.pl_data_utils_v5.EpisodeBalancedMultiDataModuleWrapper
valid_future_horizon: 30

train_datasets:
  piper_left_arm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:PIPER_HPC}/data/piper_zarr_teddy_0912
      key_map:
        _target_: egomimic.rldb.embodiment.pi05_expert_action_v3.PiperExpertActionV3.get_keymap
        keymap_mode: joint_cartesian_camframe
      transform_list:
        _target_: egomimic.rldb.embodiment.pi05_expert_action_v3.PiperExpertActionV3.get_transform_list
        mode: joint_cartesian_camframe
        stride: 1
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['task_name'] in ['teddy_0912_1', 'teddy_0912_2', 'teddy_0912_3', 'teddy_0912_4', 'teddy_0912_5']"
    mode: total
    reject_outliers: false
    error_on_nan_inf: true
  human_left_arm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:PIPER_HPC}/data/aria_put_bear_0919_zarr
      key_map:
        _target_: egomimic.rldb.embodiment.human_single_arm.get_keymap
        keymap_mode: cartesian_camframe
        has_head_pose: true
        arm: left
      transform_list:
        _target_: egomimic.rldb.embodiment.human_single_arm.get_transform_list
        mode: cartesian_camframe
        stride: 1
        arm: left
        chunk_length: 30
        actions_key: actions_cartesian_pose
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['task_name'] == 'put_bear_0919_train'"
    mode: total
    reject_outliers: false
    error_on_nan_inf: true

valid_datasets:
  piper_left_arm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:PIPER_HPC}/data/piper_zarr_teddy_0912
      key_map:
        _target_: egomimic.rldb.embodiment.pi05_expert_action_v3.PiperExpertActionV3.get_keymap
        keymap_mode: joint_cartesian_camframe
      transform_list:
        _target_: egomimic.rldb.embodiment.pi05_expert_action_v3.PiperExpertActionV3.get_transform_list
        mode: joint_cartesian_camframe
        stride: 1
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['task_name'] == 'teddy_0912_6'"
    mode: total
    reject_outliers: false
    error_on_nan_inf: true
  human_left_arm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: ${oc.env:PIPER_HPC}/data/aria_put_bear_0919_zarr
      key_map:
        _target_: egomimic.rldb.embodiment.human_single_arm.get_keymap
        keymap_mode: cartesian_camframe
        has_head_pose: true
        arm: left
      transform_list:
        _target_: egomimic.rldb.embodiment.human_single_arm.get_transform_list
        mode: cartesian_camframe
        stride: 1
        arm: left
        chunk_length: 30
        actions_key: actions_cartesian_pose
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: row['task_name'] == 'put_bear_0919_valid'"
    mode: total
    reject_outliers: false
    error_on_nan_inf: true

# CombinedLoader supplies one batch from each domain per optimizer step.  The
# Human contribution is reduced by the loss ramp; episode duration therefore
# cannot implicitly change the domain ratio.
train_dataloader_params:
  piper_left_arm: {batch_size: 1, num_workers: 4}
  human_left_arm: {batch_size: 1, num_workers: 4}
valid_dataloader_params:
  piper_left_arm: {batch_size: 1, num_workers: 4}
  human_left_arm: {batch_size: 1, num_workers: 4}

# Each episode contributes a bounded number of randomly refreshed full-horizon
# windows.  Long robot episodes no longer dominate short 4–5 s Human episodes.
train_sampler_params:
  piper_left_arm:
    samples_per_episode: 8
    future_horizon: 30
    min_query_spacing: 15
    seed: 42
  human_left_arm:
    samples_per_episode: 6
    future_horizon: 30
    min_query_spacing: 10
    seed: 4242
