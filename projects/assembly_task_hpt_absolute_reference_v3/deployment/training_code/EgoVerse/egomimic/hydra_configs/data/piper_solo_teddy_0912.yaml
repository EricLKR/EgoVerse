_target_: egomimic.pl_utils.pl_data_utils.MultiDataModuleWrapper

# Solo Piper BC on the fresh 2026-09-12 teleop collection ("Data_Collect/teddy_0912_1..7",
# 7 lerobot-format sub-datasets x 10 episodes = 70 episodes total), converted to Zarr via
# egomimic/scripts/piper_process/piper_lerobot_to_zarr.py using this rig's real
# factory RealSense intrinsics (egomimic/scripts/calibrate_camera/piper_factory_intrinsics_640x480.json).
# cartesian_camframe (not cartesian_base) since Piper.EXTRINSICS is a class-level
# calibration independent of this zarr's own (None) extrinsics field -- see piper.py.
# 80/20 train/val split per collection sub-session (episodes 0-7 train, 8-9 val, applied
# uniformly across all 7 groups since each was recorded as its own 10-episode session).
train_datasets:
  piper_left_arm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /mnt/wd10/tongxi/egoverse_piper/EgoVerse/data/piper_zarr_teddy_0912
      key_map:
        _target_: egomimic.rldb.embodiment.piper.Piper.get_keymap
        keymap_mode: cartesian_base
      transform_list:
        _target_: egomimic.rldb.embodiment.piper.Piper.get_transform_list
        mode: cartesian_camframe
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: int(row['episode_hash'].rsplit('ep', 1)[-1]) < 8"
    mode: total

valid_datasets:
  piper_left_arm:
    _target_: egomimic.rldb.zarr.zarr_dataset_multi.MultiDataset._from_resolver
    resolver:
      _target_: egomimic.rldb.zarr.zarr_dataset_multi.LocalEpisodeResolver
      folder_path: /mnt/wd10/tongxi/egoverse_piper/EgoVerse/data/piper_zarr_teddy_0912
      key_map:
        _target_: egomimic.rldb.embodiment.piper.Piper.get_keymap
        keymap_mode: cartesian_base
      transform_list:
        _target_: egomimic.rldb.embodiment.piper.Piper.get_transform_list
        mode: cartesian_camframe
    filters:
      _target_: egomimic.rldb.filters.DatasetFilter
      filter_lambdas:
        - "lambda row: int(row['episode_hash'].rsplit('ep', 1)[-1]) >= 8"
    mode: total

train_dataloader_params:
  piper_left_arm:
    batch_size: 8
    num_workers: 4
valid_dataloader_params:
  piper_left_arm:
    batch_size: 8
    num_workers: 4
